name: CI

run-name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        name: Setup java 25
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
      - run: java --version

      - uses: actions/setup-node@v7
        name: Setup NodeJs
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installing frontend dependencies
        working-directory: frontend
        run: npm ci 

      - name: Building frontend
        working-directory: frontend
        env:
          CI: false
        run: npm run build

      - name: Moving frontend bundle to project
        run: |
          rm -rf src/main/resouces/static
          mkdir -p src/main/resources/static
          cp -a frontend/build/. src/main/resources/static/
      - name: Making executable
        run: chmod +x gradlew
      - name: Building test cluster
        run: docker build -t ghcr.io/ambrosia0/test-cluster:v1 ./slurm-23

      - name: Testing
        run: ./gradlew test
      
      - name: Build image
        run: docker build . -t ghcr.io/ambrosia0/slurm-controller:1.0.0